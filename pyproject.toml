# No runtime dependencies by design: the Lambdas are stdlib + boto3 only so
# `terraform apply` needs no pip/build step. This file exists for tooling only.
[project]
name = "anyissue"
version = "0.1.0"
description = "Telegram -> structured GitHub issue capture bot on AWS Lambda"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["terraform/.terraform", "terraform/build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
